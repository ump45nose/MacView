name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  draft-release:
    name: 打包并创建草稿 Release
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: 检出标签对应的源码
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: 确认工具链
        run: |
          xcodebuild -version
          swift --version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 构建公开包
        id: package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          scripts/package.sh --adhoc --version "$version"
          short_commit=$(git rev-parse --short=12 HEAD)
          archive="build/release/MacView-$version-adhoc-$short_commit.zip"
          test -f "$archive"
          test -f "$archive.sha256"
          (cd build/release && shasum -a 256 -c "$(basename "$archive").sha256")
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      # rc 与正式版本一律先创建草稿；G6 通过后由设计侧核对及发布。
      - name: 创建草稿 Release 并上传
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" \
            --verify-tag --draft --title "$TAG" --notes "Draft release generated by CI."
