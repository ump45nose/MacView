# 由 `make project` 生成 MacView.xcodeproj（不入库）。
name: MacView
options:
  bundleIdPrefix: io.github.ump45nose
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: zh-Hans
packages:
  MacViewKit:
    path: Packages/MacViewKit
targets:
  MacView:
    type: application
    platform: macOS
    sources:
      - App
      - path: PluginSupport
        buildPhase: resources
        type: folder
    dependencies:
      - package: MacViewKit
        product: MVFoundation
      - package: MacViewKit
        product: MVIO
      - package: MacViewKit
        product: MVMedia
      - package: MacViewKit
        product: MVPipeline
      - package: MacViewKit
        product: MVSettings
      - package: MacViewKit
        product: MVCommands
      - package: MacViewKit
        product: MVLayout
      - package: MacViewKit
        product: MVReading
      - package: MacViewKit
        product: MVServices
      - package: MacViewKit
        product: MVTestSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ump45nose.MacView
        PRODUCT_NAME: MacView
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MacView
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
    # 验收证据按 App 绑定构建：把源码提交（工作区有改动时加 -dirty）写进 Info.plist 的 MVSourceCommit，签名在所有构建阶段之后。
    postBuildScripts:
      - name: 记录源码提交
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          set -eu
          commit=$(git -C "$SRCROOT" rev-parse HEAD)
          if [ -n "$(git -C "$SRCROOT" status --porcelain)" ]; then commit="$commit-dirty"; fi
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Delete :MVSourceCommit" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :MVSourceCommit string $commit" "$plist"
    scheme: {}
